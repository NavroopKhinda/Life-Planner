<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget Planner">
<meta name="theme-color" content="#10181a">
<title>Budget Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#10181a; --surface:#172326; --raise:#1f2f33; --line:#2c4046;
  --text:#e9efe9; --muted:#93a8a3; --brass:#d4b06a; --ok:#72c394; --warn:#e58a6d;
  --serif:'Fraunces',Georgia,serif; --sans:'Jost',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme: light;
    --bg:#f2f5f0; --surface:#ffffff; --raise:#e8eee7; --line:#cfd9ce;
    --text:#14211f; --muted:#587069; --brass:#80601c; --ok:#2c7850; --warn:#b04e2d;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.4}
body{padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 96px);max-width:560px;margin:0 auto}
h1,h2{font-family:var(--serif);font-weight:700;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.top h1{font-size:22px}
.top button{padding:6px 12px;font-size:14px}

.hero{padding:22px 4px 18px}
.hero .lbl{color:var(--muted);font-size:15px}
.hero .big{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.hero .msg{font-size:16px;font-weight:500}
.ok{color:var(--ok)} .warn{color:var(--warn)} .brass{color:var(--brass)}

.row{display:flex;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.field label{font-size:13px;color:var(--muted)}
input,textarea,select{width:100%;background:var(--raise);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:16px}
input:focus,textarea:focus,select:focus,button:focus-visible,.env-head:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
textarea{min-height:150px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
select{appearance:auto}
button{font:inherit;font-size:15px;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--text);padding:10px 14px;cursor:pointer}
button.primary{background:var(--brass);border-color:var(--brass);color:#1b1608}
button.danger{color:var(--warn)}
button.danger.armed{background:var(--warn);border-color:var(--warn);color:#1b0e08}
button.full{width:100%}
button.sm{padding:6px 11px;font-size:13px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

.monthbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.monthbar select{font-weight:600;min-width:0}
.monthbar button{padding:8px 18px;font-size:22px;line-height:1}
.txrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.txr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.sec h2{font-size:18px}
.sec span{color:var(--muted);font-size:14px}

.env,.debt{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.env-head{padding:13px 14px;cursor:pointer}
.env-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.env-name{font-weight:600;font-size:17px}
.env-left{font-family:var(--serif);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.env-left.neg{color:var(--warn)}
.bar{height:6px;border-radius:3px;background:var(--raise);margin:9px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);border-radius:3px}
.bar i.over{background:var(--warn)}
.bar i.done{background:var(--ok)}
.env-sub{font-size:13px;color:var(--muted)}
.panel{padding:4px 14px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.panel .row{align-items:flex-end}
.hist{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;background:var(--brass);color:#1b1608;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
.mini{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.mini .d{flex:1;min-width:0}
.mini .d small{display:block;color:var(--muted);font-size:12px}
.mini b{font-family:var(--serif);font-variant-numeric:tabular-nums}
.sub{font-weight:600;font-size:14px;color:var(--muted)}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--serif);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.seg{display:flex;background:var(--raise);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;font-size:14px;padding:9px 6px}
.seg button.on{background:var(--surface);color:var(--brass);box-shadow:0 0 0 1px var(--line)}
.note{color:var(--muted);font-size:14px;margin:0 2px 12px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}

.donut{width:230px;max-width:70%;display:block;margin:6px auto 14px}
.donut .dt1{fill:var(--text);font:700 5px var(--serif)}
.donut .dt2{fill:var(--muted);font:3px var(--sans)}
.legend .lg{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.legend .lg:first-child{border-top:0}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend .n{flex:1;min-width:0}
.legend .p{color:var(--muted);font-size:13px;width:44px;text-align:right}
.legend b{font-family:var(--serif);font-variant-numeric:tabular-nums;min-width:78px;text-align:right}
.vs{padding:9px 0;border-top:1px solid var(--line)}
.vs:first-child{border-top:0}
.vs .t{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.vs .t span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.vs .bar{margin:6px 0 0}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:10px var(--sans)}
.keys{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.tbl th{font-weight:500;color:var(--muted);text-align:right;padding:6px 0;font-size:12px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px calc(env(safe-area-inset-bottom) + 8px)}
nav .in{display:flex;gap:6px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:transparent;color:var(--muted);padding:12px 2px;font-size:13px;white-space:nowrap}
nav button.on{color:var(--brass);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
@media (prefers-reduced-motion: no-preference){.bar i{transition:width .25s ease}}
</style>
</head>
<body>
<div id="app"><p class="empty">Loading…</p></div>

<script>
const KEY = 'zeroplan-v1';          /* same key as before, so your saved data carries over */
const BASE = '1970-01';
let mem = null;

/* ---------- storage: works in Claude, in a saved web page, or in memory only ---------- */
const store = {
  async get() {
    try { if (window.storage) { const r = await window.storage.get(KEY); if (r && r.value) return r.value; } } catch (e) {}
    try { const v = localStorage.getItem(KEY); if (v) return v; } catch (e) {}
    return mem;
  },
  async set(v) {
    mem = v;
    try { if (window.storage) { await window.storage.set(KEY, v); return; } } catch (e) {}
    try { localStorage.setItem(KEY, v); } catch (e) {}
  }
};

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const r2 = n => Math.round(n * 100) / 100;
const sum = (a, f) => r2(a.reduce((t, x) => t + f(x), 0));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-CA', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = n => (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-CA');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PALETTE = ['#d4b06a', '#6fbf8e', '#6aa8de', '#e58a6d', '#b08ae0', '#e6c84f', '#5fc4c4', '#e17aa3', '#9bbf6a', '#a0a7ad'];

const nowKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthLabel = (k, long) => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-CA', { month: long ? 'long' : 'short', year: 'numeric' }); };
const monthShort = k => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('en-CA', { month: 'short' }); };
const shiftMonth = (k, n) => { const [y, m] = k.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const daysIn = (y, m) => new Date(y, m, 0).getDate();
const dayShort = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' }); };
const dayLong = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-CA', { weekday: 'long', month: 'short', day: 'numeric' }); };

/* ---------- data model ----------
   cats:      [{id, name, std:[{from,amt}], from, to}]   standard budget steps; active from/to month
   incomeStd: [{from,amt}]                                standard monthly income steps
   months:    {'2026-11': {income?, b?:{catId:amt}}}      adjustments for ONE month only
   tx:        [{id, cat, amt, date, merchant}]
   pay:       [{id, date, amt, note}]
*/
function defaultState() {
  const c = (name, amt) => ({ id: uid(), name, std: [{ from: BASE, amt }], from: null, to: null });
  return {
    v: 2, strategy: 'avalanche',
    incomeStd: [{ from: BASE, amt: 6500 }],
    cats: [c('Groceries', 800), c('Eating Out', 250), c('Coffee', 50), c('Gas', 250), c('Car Insurance', 231),
           c('Rent', 1850), c('Utilities And Phone', 235), c('Loan Payments', 2584), c('Miscellaneous', 250), c('Emergency Fund', 0)],
    months: {}, tx: [], pay: [],
    debts: [{ id: uid(), name: 'Loan', original: 13500, balance: 13500, rate: 0, payment: 2584, log: [] }]
  };
}

function upgrade(p) {
  if (p.v === 2) {
    p.cats = p.cats || []; p.tx = p.tx || []; p.pay = p.pay || []; p.months = p.months || {};
    p.debts = p.debts || []; p.incomeStd = p.incomeStd && p.incomeStd.length ? p.incomeStd : [{ from: BASE, amt: 0 }];
    return p;
  }
  /* version 1 data (envelopes) -> version 2 */
  const tx = Array.isArray(p.tx) ? p.tx.slice() : [];
  (p.envelopes || []).forEach(e => {
    if (typeof e.spent === 'number' && e.spent) tx.push({ id: uid(), cat: e.id, amt: e.spent, date: nowKey() + '-01', note: 'Earlier total' });
    if (e.sp) Object.keys(e.sp).forEach(k => { if (e.sp[k]) tx.push({ id: uid(), cat: e.id, amt: e.sp[k], date: k + '-01', note: 'Earlier total' }); });
  });
  return {
    v: 2, strategy: p.strategy || 'avalanche',
    incomeStd: [{ from: BASE, amt: num(p.income) }],
    cats: (p.envelopes || []).map(e => ({ id: e.id, name: e.name, std: [{ from: BASE, amt: num(e.budget) }], from: null, to: null })),
    months: {},
    tx: tx.map(t => ({ id: t.id || uid(), cat: t.cat, amt: t.amt, date: t.date, merchant: t.merchant || t.note || '' })),
    pay: [], debts: p.debts || []
  };
}

let S = defaultState();
const ui = { tab: 'budget', prevTab: 'budget', open: null, confirm: null, backup: '', month: nowKey(), mode: 'spend', catAll: false };

async function save() { await store.set(JSON.stringify(S)); }

/* ---------- budget logic (every month is separate) ---------- */
const stdAt = (steps, k) => { let a = steps.length ? steps[0].amt : 0; steps.forEach(s => { if (s.from <= k) a = s.amt; }); return a; };
const setStep = (steps, k, amt) => steps.filter(s => s.from !== k).concat({ from: k, amt }).sort((a, b) => a.from.localeCompare(b.from));
const findC = id => S.cats.find(c => c.id === id);
const findD = id => S.debts.find(d => d.id === id);
const catActive = (c, k) => (!c.from || k >= c.from) && (!c.to || k <= c.to);
const monthData = k => S.months[k] || {};
const ensureM = k => (S.months[k] = S.months[k] || {});
const budgetOverride = (c, k) => { const m = monthData(k); return m.b && m.b[c.id] !== undefined ? m.b[c.id] : undefined; };
const budgetOf = (c, k) => { const o = budgetOverride(c, k); return o !== undefined ? o : (catActive(c, k) ? stdAt(c.std, k) : 0); };
const incomeOf = k => { const m = monthData(k); return m.income !== undefined ? m.income : stdAt(S.incomeStd, k); };
const spentOf = (c, k) => sum(S.tx.filter(t => t.cat === c.id && t.date.startsWith(k)), t => t.amt);
const receivedOf = k => sum(S.pay.filter(p => p.date.startsWith(k)), p => p.amt);
const spendTotal = k => sum(S.tx.filter(t => t.date.startsWith(k)), t => t.amt);
const catsFor = k => S.cats.filter(c => catActive(c, k) || S.tx.some(t => t.cat === c.id && t.date.startsWith(k)));

/* ---------- debt maths ---------- */
function monthsToPay(d) {
  if (d.balance <= 0) return 0;
  if (d.payment <= 0) return Infinity;
  const r = d.rate / 100 / 12;
  if (r === 0) return Math.ceil(d.balance / d.payment);
  if (d.payment <= r * d.balance) return Infinity;
  return Math.ceil(-Math.log(1 - (r * d.balance) / d.payment) / Math.log(1 + r));
}
function payoffDate(m) {
  const d = new Date(); d.setMonth(d.getMonth() + m);
  return d.toLocaleDateString('en-CA', { month: 'short', year: 'numeric' });
}
function sortedDebts() {
  const live = S.debts.filter(d => d.balance > 0), done = S.debts.filter(d => d.balance <= 0);
  live.sort((a, b) => S.strategy === 'avalanche' ? b.rate - a.rate || a.balance - b.balance : a.balance - b.balance);
  return live.concat(done);
}

/* ---------- shared view pieces ---------- */
function confirmBtn(key, label, act, id, small) {
  const armed = ui.confirm === key;
  return `<button class="danger ${small ? 'sm' : ''} ${armed ? 'armed' : ''}" data-act="${act}" data-id="${id || ''}" data-key="${key}">${armed ? 'Tap again to confirm' : label}</button>`;
}
const monthNames = () => Array.from({ length: 12 }, (_, i) => new Date(2000, i, 1).toLocaleDateString('en-CA', { month: 'long' }));
function yearOptions(sel) {
  const y0 = Math.min(2020, +sel), y1 = Math.max(new Date().getFullYear() + 5, +sel);
  let o = '';
  for (let y = y0; y <= y1; y++) o += `<option value="${y}" ${y === +sel ? 'selected' : ''}>${y}</option>`;
  return o;
}
function monthBar() {
  const [y, m] = ui.month.split('-');
  const mo = monthNames().map((n, i) => `<option value="${String(i + 1).padStart(2, '0')}" ${i + 1 === +m ? 'selected' : ''}>${n}</option>`).join('');
  return `<div class="monthbar">
    <button data-act="prevmonth" aria-label="Previous month">&lsaquo;</button>
    <select data-f="month-m" aria-label="Month" style="flex:1.4">${mo}</select>
    <select data-f="month-y" aria-label="Year" style="flex:1">${yearOptions(y)}</select>
    <button data-act="nextmonth" aria-label="Next month">&rsaquo;</button>
  </div>`;
}
function dateSelects(p) {
  const [cy, cm] = ui.month.split('-').map(Number);
  const dd = ui.month === nowKey() ? new Date().getDate() : 1;
  const days = Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}" ${i + 1 === dd ? 'selected' : ''}>${i + 1}</option>`).join('');
  const mo = monthNames().map((n, i) => `<option value="${i + 1}" ${i + 1 === cm ? 'selected' : ''}>${n}</option>`).join('');
  return `<div class="row">
    <select id="${p}-d" aria-label="Day" style="flex:.8">${days}</select>
    <select id="${p}-m" aria-label="Month" style="flex:1.6">${mo}</select>
    <select id="${p}-y" aria-label="Year" style="flex:1.1">${yearOptions(cy)}</select>
  </div>`;
}
function readDate(p) {
  const y = +val(p + '-y'), m = +val(p + '-m'), d = Math.min(+val(p + '-d'), daysIn(y, m));
  return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}
function merchantList() {
  const count = {};
  S.tx.forEach(t => { const m = (t.merchant || '').trim(); if (m && m !== 'Earlier total') { const k = m.toLowerCase(); count[k] = count[k] || { n: m, c: 0 }; count[k].c++; } });
  return Object.values(count).sort((a, b) => b.c - a.c).slice(0, 60).map(x => `<option value="${esc(x.n)}"></option>`).join('');
}

/* ---------- Budget tab ---------- */
function catPanel(c, k) {
  const ov = budgetOverride(c, k) !== undefined;
  const list = S.tx.filter(t => t.cat === c.id && (ui.catAll || t.date.startsWith(k))).sort((a, b) => b.date.localeCompare(a.date));
  const rows = list.map(t => `<div class="mini"><div class="d">${esc(t.merchant || 'No merchant')}<small>${dayShort(t.date)}${ui.catAll ? ' ' + t.date.slice(0, 4) : ''}</small></div><b>${money(t.amt)}</b>${confirmBtn('tx-' + t.id, 'Delete', 'deltx', t.id, true)}</div>`).join('');
  return `<div class="panel">
    <div class="field"><label>Category name</label><input data-f="cat-name" data-id="${c.id}" value="${esc(c.name)}"></div>
    <div class="field"><label>Budget for ${monthLabel(k)}</label>
      <input type="number" inputmode="decimal" step="0.01" data-f="cat-budget" data-id="${c.id}" value="${budgetOf(c, k)}">
      <div class="env-sub">Standard: ${money(stdAt(c.std, k))}${ov ? ' · adjusted for this month' : ''}</div></div>
    <div class="btnrow" style="margin-top:0">
      ${budgetOf(c, k) !== stdAt(c.std, k) ? `<button class="sm" data-act="makeStdBudget" data-id="${c.id}">Make standard from ${monthLabel(k)}</button>` : ''}
      ${ov ? `<button class="sm" data-act="resetBudget" data-id="${c.id}">Back to standard</button>` : ''}
    </div>
    <div class="sub">Transactions ${ui.catAll ? '(all months)' : 'in ' + monthLabel(k)}</div>
    <div>${rows || '<div class="env-sub" style="padding:6px 0">Nothing logged yet.</div>'}</div>
    <button class="sm" data-act="togglecatall">${ui.catAll ? 'Show this month only' : 'Show all months'}</button>
    ${confirmBtn('cat-' + c.id, 'Remove from ' + monthLabel(k) + ' on', 'delcat', c.id)}
  </div>`;
}

function viewBudget() {
  const k = ui.month, cats = catsFor(k);
  const inc = incomeOf(k), stdInc = stdAt(S.incomeStd, k);
  const assigned = sum(cats, c => budgetOf(c, k));
  const left = r2(inc - assigned);
  const cls = left === 0 ? 'ok' : left > 0 ? 'brass' : 'warn';
  const msg = left === 0 ? 'Every dollar has a job.' : left > 0 ? 'Give this money a job.' : 'Over-assigned. Trim a category.';
  const spent = sum(cats, c => spentOf(c, k));
  const recv = receivedOf(k), nPay = S.pay.filter(p => p.date.startsWith(k)).length;
  const ovInc = monthData(k).income !== undefined;

  const btns = [];
  if (recv > 0 && recv !== inc) btns.push(`<button class="sm" data-act="useReceived">Use received (${money(recv)})</button>`);
  if (inc !== stdInc) btns.push(`<button class="sm" data-act="makeStdIncome">Make standard from ${monthLabel(k)}</button>`);
  if (ovInc) btns.push(`<button class="sm" data-act="resetIncome">Back to standard</button>`);

  const rows = cats.map(c => {
    const b = budgetOf(c, k), sp = spentOf(c, k), rem = r2(b - sp);
    const pct = b > 0 ? Math.min(100, Math.max(0, (sp / b) * 100)) : 0;
    const open = ui.open === c.id;
    return `<div class="env">
      <div class="env-head" role="button" tabindex="0" data-act="toggle" data-id="${c.id}">
        <div class="env-top"><span class="env-name">${esc(c.name)}</span><span class="env-left ${rem < 0 ? 'neg' : ''}">${money(rem)}</span></div>
        <div class="bar"><i class="${rem < 0 ? 'over' : ''}" style="width:${pct}%"></i></div>
        <div class="env-sub">${money(sp)} spent of ${money(b)}</div>
      </div>
      ${open ? catPanel(c, k) : ''}
    </div>`;
  }).join('');

  return `
  ${monthBar()}
  <div class="hero">
    <div class="lbl">Left to assign</div>
    <div class="big ${cls}">${money(left)}</div>
    <div class="msg ${cls}">${msg}</div>
  </div>
  <div class="card">
    <div class="field"><label>Income for ${monthLabel(k, true)}</label>
      <input type="number" inputmode="decimal" step="0.01" data-f="m-income" value="${inc}"></div>
    <div class="env-sub" style="margin-top:6px">Standard ${money(stdInc)} · Received ${money(recv)} from ${nPay} paycheque${nPay === 1 ? '' : 's'}</div>
    ${btns.length ? `<div class="btnrow">${btns.join('')}</div>` : ''}
  </div>
  <div class="sec"><h2>Categories</h2><span>${money(spent)} spent in ${monthLabel(k)}</span></div>
  ${rows || '<div class="empty">No categories yet. Add your first one below.</div>'}
  <div class="card">
    <div class="field" style="margin-bottom:10px"><label>New category (starts ${monthLabel(k)})</label><input id="new-cat-name" placeholder="e.g. Savings and investing"></div>
    <div class="row">
      <div class="field"><label>Standard monthly budget</label><input id="new-cat-budget" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <button class="primary" data-act="addcat">Add category</button>
    </div>
  </div>
  <div class="card">
    <p class="note" style="margin-top:0">Put ${monthLabel(k)}'s income and every category back to the standard amounts. Transactions and paycheques are not touched.</p>
    ${confirmBtn('resetmonth', 'Reset ' + monthLabel(k) + ' to standard', 'resetmonth')}
  </div>`;
}

/* ---------- Transactions tab (spending + paycheques) ---------- */
function viewTx() {
  const k = ui.month;
  const seg = `<div class="seg">
    <button class="${ui.mode === 'spend' ? 'on' : ''}" data-act="setmode" data-id="spend">Spending</button>
    <button class="${ui.mode === 'pay' ? 'on' : ''}" data-act="setmode" data-id="pay">Paycheques</button>
  </div>`;
  return monthBar() + seg + (ui.mode === 'spend' ? viewSpend(k) : viewPay(k));
}

function viewSpend(k) {
  const list = S.tx.filter(t => t.date.startsWith(k)).sort((a, b) => b.date.localeCompare(a.date));
  const total = sum(list, t => t.amt);
  const cats = catsFor(k).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  const name = id => { const c = findC(id); return c ? esc(c.name) : 'Deleted category'; };
  let rows = '', last = '';
  list.forEach(t => {
    if (t.date !== last) { last = t.date; rows += `<div class="sec" style="margin:16px 2px 6px"><h2 style="font-size:16px">${dayLong(t.date)}</h2></div>`; }
    rows += `<div class="env"><div class="txrow">
      <div><div class="env-name">${esc(t.merchant || name(t.cat))}</div><div class="env-sub">${t.merchant ? name(t.cat) : 'No merchant'}</div></div>
      <div class="txr"><span class="env-left">${money(t.amt)}</span>${confirmBtn('tx-' + t.id, 'Delete', 'deltx', t.id, true)}</div>
    </div></div>`;
  });
  return `
  <div class="hero">
    <div class="lbl">Spent in ${monthLabel(k, true)}</div>
    <div class="big brass">${money(total)}</div>
  </div>
  <div class="card">
    <div class="field" style="margin-bottom:10px"><label>Category</label><select id="tx-cat">${cats}</select></div>
    <div class="field" style="margin-bottom:10px"><label>Date</label>${dateSelects('tx')}</div>
    <div class="row" style="margin-bottom:10px">
      <div class="field"><label>Amount</label><input id="tx-amt" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Merchant</label><input id="tx-merchant" list="merchants" placeholder="e.g. Costco" autocomplete="off"></div>
    </div>
    <datalist id="merchants">${merchantList()}</datalist>
    <button class="primary full" data-act="addtx">Add transaction</button>
  </div>
  ${rows || '<div class="empty">No transactions in this month yet.</div>'}`;
}

function viewPay(k) {
  const list = S.pay.filter(p => p.date.startsWith(k)).sort((a, b) => b.date.localeCompare(a.date));
  const recv = receivedOf(k), planned = incomeOf(k), diff = r2(recv - planned);
  const rows = list.map(p => `<div class="env"><div class="txrow">
      <div><div class="env-name">${esc(p.note || 'Paycheque')}</div><div class="env-sub">${dayLong(p.date)}</div></div>
      <div class="txr"><span class="env-left ok">${money(p.amt)}</span>${confirmBtn('pay-' + p.id, 'Delete', 'delpay', p.id, true)}</div>
    </div></div>`).join('');
  return `
  <div class="hero">
    <div class="lbl">Received in ${monthLabel(k, true)}</div>
    <div class="big ok">${money(recv)}</div>
    <div class="msg">Planned ${money(planned)}${recv > 0 ? ` · ${diff >= 0 ? money(diff) + ' ahead' : money(-diff) + ' behind'}` : ''}</div>
  </div>
  <div class="card">
    <div class="field" style="margin-bottom:10px"><label>Pay date</label>${dateSelects('pay')}</div>
    <div class="row" style="margin-bottom:10px">
      <div class="field"><label>Amount</label><input id="pay-amt" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Note (optional)</label><input id="pay-note" placeholder="e.g. Bi-weekly"></div>
    </div>
    <button class="primary full" data-act="addpay">Add paycheque</button>
    ${recv > 0 && recv !== planned ? `<div class="btnrow"><button data-act="useReceived">Set ${monthLabel(k)} income to ${money(recv)}</button></div>` : ''}
  </div>
  ${rows || '<div class="empty">No paycheques logged in this month yet.</div>'}`;
}

/* ---------- Reports tab ---------- */
function donut(items, total) {
  let off = 25, segs = '';
  items.forEach(it => {
    const p = (it.v / total) * 100;
    segs += `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${it.color}" stroke-width="6" stroke-dasharray="${p.toFixed(3)} ${(100 - p).toFixed(3)}" stroke-dashoffset="${off.toFixed(3)}"></circle>`;
    off -= p;
  });
  return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="Spending by category">${segs}<text x="21" y="21" text-anchor="middle" class="dt1">${money0(total)}</text><text x="21" y="26" text-anchor="middle" class="dt2">spent</text></svg>`;
}

function trendChart(keys) {
  const data = keys.map(k => { const rec = receivedOf(k); return { k, inc: rec > 0 ? rec : incomeOf(k), planned: rec <= 0, sp: spendTotal(k) }; });
  const max = Math.max(1, ...data.map(d => Math.max(d.inc, d.sp)));
  const W = 320, H = 160, top = 8, bot = 22, ch = H - top - bot, n = data.length, gw = W / n, bw = Math.min(26, gw * 0.3);
  let bars = '';
  data.forEach((d, i) => {
    const cx = i * gw + gw / 2, hi = (d.inc / max) * ch, hs = (d.sp / max) * ch;
    bars += `<rect x="${(cx - bw - 2).toFixed(1)}" y="${(top + ch - hi).toFixed(1)}" width="${bw.toFixed(1)}" height="${hi.toFixed(1)}" rx="3" fill="var(--ok)" opacity="${d.planned ? 0.45 : 1}"></rect>`;
    bars += `<rect x="${(cx + 2).toFixed(1)}" y="${(top + ch - hs).toFixed(1)}" width="${bw.toFixed(1)}" height="${hs.toFixed(1)}" rx="3" fill="var(--brass)"></rect>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H - 6}" text-anchor="middle">${monthShort(d.k)}</text>`;
  });
  const table = data.map(d => {
    const left = r2(d.inc - d.sp);
    return `<tr><td>${monthLabel(d.k)}</td><td>${money0(d.inc)}${d.planned ? '*' : ''}</td><td>${money0(d.sp)}</td><td class="${left < 0 ? 'warn' : 'ok'}">${money0(left)}</td></tr>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Income and spending by month"><line x1="0" y1="${top + ch}" x2="${W}" y2="${top + ch}" stroke="var(--line)"></line>${bars}</svg>
    <div class="keys"><span><i style="background:var(--ok)"></i>Income</span><span><i style="background:var(--brass)"></i>Spent</span></div>
    <table class="tbl"><tr><th>Month</th><th>Income</th><th>Spent</th><th>Left</th></tr>${table}</table>
    <p class="env-sub" style="margin:8px 0 0">* No paycheques logged, so this month shows the planned income.</p>`;
}

function viewReports() {
  const k = ui.month, cats = catsFor(k);
  const rows = cats.map(c => ({ c, spent: spentOf(c, k), budget: budgetOf(c, k), color: PALETTE[Math.max(0, S.cats.indexOf(c)) % PALETTE.length] }));
  const total = sum(rows, r => r.spent);
  const spendRows = rows.filter(r => r.spent > 0).sort((a, b) => b.spent - a.spent);

  const legend = spendRows.map(r => `<div class="lg"><i style="background:${r.color}"></i><span class="n">${esc(r.c.name)}</span><span class="p">${Math.round((r.spent / total) * 100)}%</span><b>${money(r.spent)}</b></div>`).join('');
  const vs = rows.filter(r => r.spent > 0 || r.budget > 0).map(r => {
    const pct = r.budget > 0 ? Math.min(100, (r.spent / r.budget) * 100) : (r.spent > 0 ? 100 : 0);
    return `<div class="vs"><div class="t"><span>${esc(r.c.name)}</span><span>${money0(r.spent)} of ${money0(r.budget)}</span></div><div class="bar"><i class="${r.spent > r.budget ? 'over' : ''}" style="width:${pct}%"></i></div></div>`;
  }).join('');

  const mm = {};
  S.tx.filter(t => t.date.startsWith(k) && (t.merchant || '').trim() && t.merchant !== 'Earlier total').forEach(t => {
    const key = t.merchant.trim().toLowerCase();
    mm[key] = mm[key] || { n: t.merchant.trim(), v: 0, c: 0 }; mm[key].v = r2(mm[key].v + t.amt); mm[key].c++;
  });
  const merchants = Object.values(mm).sort((a, b) => b.v - a.v).slice(0, 6)
    .map(m => `<div class="lg"><span class="n">${esc(m.n)}<br><small class="env-sub">${m.c} transaction${m.c === 1 ? '' : 's'}</small></span><b>${money(m.v)}</b></div>`).join('');

  const dates = S.tx.map(t => t.date.slice(0, 7)).concat(S.pay.map(p => p.date.slice(0, 7))).sort();
  let keys = [];
  for (let i = 5; i >= 0; i--) keys.push(shiftMonth(k, -i));
  if (dates.length) keys = keys.filter(x => x >= dates[0]);
  else keys = [];

  return `
  ${monthBar()}
  <div class="sec"><h2>Where the money went</h2><span>${monthLabel(k)}</span></div>
  <div class="card">
    ${total > 0 ? donut(spendRows.map(r => ({ v: r.spent, color: r.color })), total) + `<div class="legend">${legend}</div>` : '<div class="empty">No spending logged in this month yet.</div>'}
  </div>
  <div class="sec"><h2>Budget vs actual</h2><span>${monthLabel(k)}</span></div>
  <div class="card">${vs || '<div class="empty">No categories with a budget or spending yet.</div>'}</div>
  <div class="sec"><h2>Top merchants</h2><span>${monthLabel(k)}</span></div>
  <div class="card"><div class="legend">${merchants || '<div class="empty">Add a merchant to your transactions to see them here.</div>'}</div></div>
  <div class="sec"><h2>Income vs spending</h2><span>Last 6 months</span></div>
  <div class="card">${keys.length ? trendChart(keys) : '<div class="empty">Log some transactions or paycheques to see this.</div>'}</div>`;
}

/* ---------- Debts tab ---------- */
function viewDebts() {
  const list = sortedDebts();
  const owed = sum(S.debts, d => d.balance);
  const monthly = sum(S.debts.filter(d => d.balance > 0), d => d.payment);
  const ms = S.debts.filter(d => d.balance > 0).map(monthsToPay);
  const worst = ms.length ? Math.max(...ms) : 0;
  const free = !ms.length ? 'Done' : worst === Infinity ? 'Never' : payoffDate(worst);

  const cards = list.map((d, i) => {
    const m = monthsToPay(d);
    const paidPct = d.original > 0 ? Math.min(100, Math.max(0, ((d.original - d.balance) / d.original) * 100)) : 0;
    const open = ui.open === d.id;
    let sub;
    if (d.balance <= 0) sub = 'Paid off';
    else if (d.payment <= 0) sub = 'Set a monthly payment to see a payoff date';
    else if (m === Infinity) sub = 'Payment is too small to cover interest';
    else sub = `${m} month${m === 1 ? '' : 's'} left · paid off ${payoffDate(m)}`;
    const first = i === 0 && d.balance > 0 && list.filter(x => x.balance > 0).length > 1;
    const log = (d.log || []).slice(0, 5).map(p => `${p.d}: ${money(p.a)}`).join('<br>');
    return `<div class="debt">
      <div class="env-head" role="button" tabindex="0" data-act="toggle" data-id="${d.id}">
        <div class="env-top"><span class="env-name">${esc(d.name)}${first ? '<span class="tag">Extra goes here</span>' : ''}</span><span class="env-left">${money(d.balance)}</span></div>
        <div class="bar"><i class="${d.balance <= 0 ? 'done' : ''}" style="width:${paidPct}%"></i></div>
        <div class="env-sub">${esc(sub)}</div>
      </div>
      ${open ? `<div class="panel">
        <div class="row">
          <div class="field"><label>Log a payment</label><input id="pay-${d.id}" type="number" inputmode="decimal" step="0.01" placeholder="${d.payment || '0.00'}"></div>
          <button class="primary" data-act="logpay" data-id="${d.id}">Log payment</button>
        </div>
        ${log ? `<div class="hist">Recent payments<br>${log}</div>` : ''}
        <div class="field"><label>Name</label><input data-f="debt-name" data-id="${d.id}" value="${esc(d.name)}"></div>
        <div class="row">
          <div class="field"><label>Balance now</label><input type="number" inputmode="decimal" step="0.01" data-f="debt-balance" data-id="${d.id}" value="${d.balance}"></div>
          <div class="field"><label>Starting amount</label><input type="number" inputmode="decimal" step="0.01" data-f="debt-original" data-id="${d.id}" value="${d.original}"></div>
        </div>
        <div class="row">
          <div class="field"><label>Interest rate (% a year)</label><input type="number" inputmode="decimal" step="0.01" data-f="debt-rate" data-id="${d.id}" value="${d.rate}"></div>
          <div class="field"><label>Monthly payment</label><input type="number" inputmode="decimal" step="0.01" data-f="debt-payment" data-id="${d.id}" value="${d.payment}"></div>
        </div>
        ${confirmBtn('debt-' + d.id, 'Delete debt', 'deldebt', d.id)}
      </div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="hero">
    <div class="lbl">Total owed</div>
    <div class="big ${owed > 0 ? 'brass' : 'ok'}">${money(owed)}</div>
    <div class="msg">${owed > 0 ? 'Every payment moves this number down.' : 'Debt-free.'}</div>
  </div>
  <div class="stats">
    <div class="stat"><b>${money(monthly)}</b><span>Paid monthly</span></div>
    <div class="stat"><b>${S.debts.filter(d => d.balance > 0).length}</b><span>Debts left</span></div>
    <div class="stat"><b>${free}</b><span>Debt-free</span></div>
  </div>
  <div class="seg">
    <button class="${S.strategy === 'avalanche' ? 'on' : ''}" data-act="strategy" data-id="avalanche">Highest rate first</button>
    <button class="${S.strategy === 'snowball' ? 'on' : ''}" data-act="strategy" data-id="snowball">Smallest balance first</button>
  </div>
  ${list.length > 1 ? `<p class="note">${S.strategy === 'avalanche' ? 'Costs the least interest.' : 'Clears debts fastest, which keeps you motivated.'} The debt marked "Extra goes here" gets any money beyond the minimums. The debt-free date assumes each debt keeps its own monthly payment.</p>` : ''}
  ${cards || '<div class="empty">No debts yet. Add one below.</div>'}
  <div class="card">
    <div class="field" style="margin-bottom:10px"><label>New debt</label><input id="new-debt-name" placeholder="e.g. Car loan"></div>
    <div class="row" style="margin-bottom:10px">
      <div class="field"><label>Balance</label><input id="new-debt-bal" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <div class="field"><label>Rate % a year</label><input id="new-debt-rate" type="number" inputmode="decimal" step="0.01" placeholder="0"></div>
    </div>
    <div class="row">
      <div class="field"><label>Monthly payment</label><input id="new-debt-pay" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div>
      <button class="primary" data-act="adddebt">Add debt</button>
    </div>
  </div>`;
}

/* ---------- Backup ---------- */
function viewBackup() {

function render() {
  const views = { budget: viewBudget, tx: viewTx, reports: viewReports, debts: viewDebts, backup: viewBackup };
  const tab = (id, label) => `<button class="${ui.tab === id ? 'on' : ''}" data-act="tab" data-id="${id}">${label}</button>`;
  const inBackup = ui.tab === 'backup';
  document.getElementById('app').innerHTML =
    `<div class="top"><h1>Budget Planner</h1><button data-act="${inBackup ? 'closebackup' : 'openbackup'}">${inBackup ? 'Close' : 'Backup'}</button></div>${views[ui.tab]()}` +
    `<nav><div class="in">${tab('budget', 'Budget')}${tab('tx', 'Transactions')}${tab('reports', 'Reports')}${tab('debts', 'Debts')}</div></nav>`;
}

/* ---------- actions ---------- */
const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
const todayStr = () => new Date().toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
function needConfirm(key) {
  if (ui.confirm === key) { ui.confirm = null; return true; }
  ui.confirm = key; render(); return false;
}
function done() { save(); render(); }

const actions = {
  tab(d) { ui.tab = d.id; ui.open = null; ui.confirm = null; ui.backup = ''; render(); window.scrollTo(0, 0); },
  openbackup() { ui.prevTab = ui.tab; ui.tab = 'backup'; ui.open = null; ui.confirm = null; render(); window.scrollTo(0, 0); },
  closebackup() { ui.tab = ui.prevTab || 'budget'; ui.backup = ''; ui.confirm = null; render(); },
  toggle(d) { ui.open = ui.open === d.id ? null : d.id; ui.confirm = null; ui.catAll = false; render(); },
  togglecatall() { ui.catAll = !ui.catAll; render(); },
  prevmonth() { ui.month = shiftMonth(ui.month, -1); ui.open = null; render(); },
  nextmonth() { ui.month = shiftMonth(ui.month, 1); ui.open = null; render(); },
  setmode(d) { ui.mode = d.id; ui.confirm = null; render(); },

  useReceived() { ensureM(ui.month).income = receivedOf(ui.month); done(); },
  makeStdIncome() { const k = ui.month; S.incomeStd = setStep(S.incomeStd, k, incomeOf(k)); if (S.months[k]) delete S.months[k].income; done(); },
  resetIncome() { if (S.months[ui.month]) delete S.months[ui.month].income; done(); },
  makeStdBudget(d) {
    const c = findC(d.id), k = ui.month; if (!c) return;
    c.std = setStep(c.std, k, budgetOf(c, k));
    const m = S.months[k]; if (m && m.b) delete m.b[c.id];
    done();
  },
  resetBudget(d) { const m = S.months[ui.month]; if (m && m.b) delete m.b[d.id]; done(); },
  resetmonth(d) { if (!needConfirm(d.key)) return; delete S.months[ui.month]; done(); },

  addcat() {
    const name = val('new-cat-name').trim(); if (!name) return;
    S.cats.push({ id: uid(), name, std: [{ from: BASE, amt: Math.max(0, num(val('new-cat-budget'))) }], from: ui.month, to: null });
    done();
  },
  delcat(d) {
    if (!needConfirm(d.key)) return;
    const c = findC(d.id), k = ui.month; if (!c) return;
    const earlier = S.tx.some(t => t.cat === c.id && t.date.slice(0, 7) < k);
    S.tx = S.tx.filter(t => !(t.cat === c.id && (!earlier || t.date.slice(0, 7) >= k)));
    Object.keys(S.months).forEach(m => { if (!earlier || m >= k) { const x = S.months[m]; if (x && x.b) delete x.b[c.id]; } });
    if (earlier) c.to = shiftMonth(k, -1); else S.cats = S.cats.filter(x => x.id !== c.id);
    ui.open = null; done();
  },

  addtx() {
    const cat = val('tx-cat'), amt = num(val('tx-amt'));
    if (!cat || amt <= 0) return;
    const date = readDate('tx');
    S.tx.push({ id: uid(), cat, amt: r2(amt), date, merchant: val('tx-merchant').trim() });
    ui.month = date.slice(0, 7); done();
  },
  deltx(d) { if (!needConfirm(d.key)) return; S.tx = S.tx.filter(t => t.id !== d.id); done(); },
  addpay() {
    const amt = num(val('pay-amt')); if (amt <= 0) return;
    const date = readDate('pay');
    S.pay.push({ id: uid(), date, amt: r2(amt), note: val('pay-note').trim() });
    ui.month = date.slice(0, 7); done();
  },
  delpay(d) { if (!needConfirm(d.key)) return; S.pay = S.pay.filter(p => p.id !== d.id); done(); },

  strategy(d) { S.strategy = d.id; done(); },
  adddebt() {
    const name = val('new-debt-name').trim(), bal = num(val('new-debt-bal'));
    if (!name || bal <= 0) return;
    S.debts.push({ id: uid(), name, original: bal, balance: bal, rate: num(val('new-debt-rate')), payment: num(val('new-debt-pay')), log: [] });
    done();
  },
  deldebt(d) { if (!needConfirm(d.key)) return; S.debts = S.debts.filter(x => x.id !== d.id); ui.open = null; done(); },
  logpay(d) {
    const x = findD(d.id); if (!x) return;
    const a = num(val('pay-' + d.id)) || x.payment;
    if (a <= 0) return;
    x.balance = r2(Math.max(0, x.balance - a));
    x.log = [{ d: todayStr(), a }].concat(x.log || []).slice(0, 30);
    done();
  },

  copy() {
    const t = document.getElementById('backup-text'); t.select();
    try { document.execCommand('copy'); } catch (e) {}
    if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(() => {});
  },
  restore() {
    const t = val('backup-text');
    try {
      const p = JSON.parse(t);
      if (!p || !Array.isArray(p.debts) || !(Array.isArray(p.cats) || Array.isArray(p.envelopes))) throw 0;
      S = upgrade(p); ui.backup = ''; done();
    } catch (e) { ui.backup = t; alert('That text is not a valid backup. Copy the whole backup and try again.'); }
  },
  reset(d) { if (!needConfirm(d.key)) return; S = defaultState(); ui.open = null; done(); }
};

const fields = {
  'm-income': (id, v) => { ensureM(ui.month).income = num(v); },
  'cat-name': (id, v) => { const c = findC(id); if (c && v.trim()) c.name = v.trim(); },
  'cat-budget': (id, v) => { const c = findC(id); if (!c) return; const m = ensureM(ui.month); m.b = m.b || {}; m.b[id] = Math.max(0, num(v)); },
  'debt-name': (id, v) => { const x = findD(id); if (x && v.trim()) x.name = v.trim(); },
  'debt-balance': (id, v) => { const x = findD(id); if (x) x.balance = Math.max(0, num(v)); },
  'debt-original': (id, v) => { const x = findD(id); if (x) x.original = Math.max(0, num(v)); },
  'debt-rate': (id, v) => { const x = findD(id); if (x) x.rate = Math.max(0, num(v)); },
  'debt-payment': (id, v) => { const x = findD(id); if (x) x.payment = Math.max(0, num(v)); },
  'month-m': (id, v) => { ui.month = ui.month.slice(0, 4) + '-' + v; ui.open = null; },
  'month-y': (id, v) => { ui.month = v + '-' + ui.month.slice(5); ui.open = null; }
};

const app = document.getElementById('app');
app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && actions[t.dataset.act]) actions[t.dataset.act](t.dataset);
});
app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.env-head')) { e.preventDefault(); e.target.click(); }
});
app.addEventListener('change', e => {
  const f = e.target.dataset && e.target.dataset.f;
  if (f && fields[f]) { fields[f](e.target.dataset.id, e.target.value); done(); }
});

/* ---------- start ---------- */
(async function init() {
  try {
    const raw = await store.get();
    if (raw) {
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.debts) && (Array.isArray(p.cats) || Array.isArray(p.envelopes))) { S = upgrade(p); save(); }
    }
  } catch (e) {}
  render();
})();
</script>
</body>
